name: Sweeper

# Manual only. The bot runs its own sweep every 5 minutes (SWEEP_INTERVAL_SECONDS); this workflow triggers one
# on demand from the Actions tab or with `gh workflow run Sweeper`.
#
# It used to run on a schedule ("*/5 * * * *"), but GitHub ran it only every 5 to 8 hours, and each run hit a
# sleeping free Render service that took about a minute to wake, so curl gave up and every run failed.
on:
  workflow_dispatch:

jobs:
  sweep:
    if: ${{ vars.BOT_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call the sweep endpoint
        # 120 s: a sleeping free Render service takes about a minute to wake on the first request.
        run: |
          curl --fail --silent --show-error --max-time 120 -X POST \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}" \
            "${{ vars.BOT_URL }}/internal/sweep"
