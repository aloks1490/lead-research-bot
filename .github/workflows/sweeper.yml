name: Sweeper

# Every 5 minutes: time out jobs Clay never answered, and resume jobs a restart left mid-way.
# GitHub's cron is best-effort and can run late; for tighter timing use Supabase pg_cron + pg_net to call the same URL.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sweep endpoint
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}" \
            "${{ vars.BOT_URL }}/internal/sweep"
